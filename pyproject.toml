[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docweave"
version = "0.1.0"
description = "Living documentation: weaves static code analysis and developer communication into docs that know when they are stale."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic"]

[project.scripts]
docweave = "docweave.cli:main"

[tool.setuptools.packages.find]
include = ["docweave*"]
